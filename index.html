<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="app-version" content="0.8">
  <title>Friend Speak Type</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="t bar-btn" data-act="say" data-text="Igen" data-slot="yes">IGEN</button>
      <button class="t bar-btn center" data-act="open-messages" data-longact="reader-open" data-slot="open-msg" aria-label="Mentett üzenetek (hosszan nyomva: teljes képernyős olvasás)">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 8l8 8 8-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="t bar-btn" data-act="say" data-text="Nem" data-slot="no">NEM</button>
    </header>

    <section id="inputrow">
      <button class="t io-btn" data-act="clear" data-slot="clear" aria-label="Törlés">
        <svg viewBox="0 0 24 24" class="ico ico-x"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-end"><path d="M12 4v13M5 11l7 7 7-7M5 21h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="editor-wrap" class="t" data-act="editor-menu" data-long="1" data-scroll="1" data-slot="editor">
        <div id="editor" class="empty"></div>
        <textarea id="editor-ta" data-native hidden spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
        <div id="placeholder">Írj ide…</div>
        <div id="scrollbar" aria-hidden="true"><div id="scrollthumb"></div></div>
      </div>
      <button class="t io-btn" id="speak-btn" data-act="speak" data-slot="speak" aria-label="Kimondás">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </section>

    <section id="suggest"></section>
    <section id="keyboard"></section>

    <!-- Teljes képernyős olvasás: kurzormozgató gombok és a visszacsukó gomb -->
    <nav id="readnav" hidden>
      <button class="t rn-btn" data-act="nav-start" data-slot="rn-start" aria-label="Az elejére"><svg viewBox="0 0 24 24" class="ico"><path d="M5 4v16M19 5l-9 7 9 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="t rn-btn" data-act="nav-up" data-slot="rn-up" aria-label="Egy sorral feljebb"><svg viewBox="0 0 24 24" class="ico"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="t rn-btn" data-act="left" data-slot="rn-left" aria-label="Balra"><svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="t rn-btn" data-act="right" data-slot="rn-right" aria-label="Jobbra"><svg viewBox="0 0 24 24" class="ico"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="t rn-btn" data-act="nav-down" data-slot="rn-down" aria-label="Egy sorral lejjebb"><svg viewBox="0 0 24 24" class="ico"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="t rn-btn" data-act="nav-end" data-slot="rn-end" aria-label="A végére"><svg viewBox="0 0 24 24" class="ico"><path d="M19 4v16M5 5l9 7-9 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
    <footer id="readbar" hidden>
      <button class="t bar-btn center" data-act="reader-close" data-long="1" data-slot="reader-close" aria-label="Vissza a billentyűzethez (hosszan nyomva)">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 16l8-8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>
    <div id="status" aria-live="polite"></div>
  </div>

  <!-- Mentett üzenetek -->
  <div id="overlay-messages" class="overlay" hidden>
    <div class="ov-head">
      <button class="t ov-btn" data-act="close-overlay" data-slot="m-close">✕ Bezár</button>
      <div class="tabs" id="msg-tabs"></div>
      <button class="t ov-btn gear" data-act="open-settings" data-slot="m-gear" aria-label="Beállítások">
        <svg viewBox="0 0 24 24" class="ico"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
    <div id="msg-body" class="cards"></div>
    <div class="ov-foot" id="msg-foot"></div>
  </div>

  <!-- Beállítások -->
  <div id="overlay-settings" class="overlay" hidden>
    <div class="ov-head">
      <button class="t ov-btn" data-act="close-overlay" data-slot="s-close">✕ Bezár</button>
      <div class="tabs" id="set-tabs"></div>
    </div>
    <div id="set-body" class="settings-body"></div>
  </div>

  <!-- Kód megadása -->
  <div id="overlay-pin" class="overlay" hidden>
    <div class="ov-head">
      <button class="t ov-btn" data-act="pin-cancel" data-slot="p-close">✕ Mégse</button>
      <div id="pin-title" class="pin-title"></div>
    </div>
    <div id="pin-dots" class="pin-dots"></div>
    <div id="pin-pad" class="pin-pad"></div>
  </div>

  <!-- Szövegmező menü (hosszú nyomásra) -->
  <div id="sheet-edit" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <button class="t sheet-btn" data-act="place-caret" data-slot="sh-caret">📍 IDE A KURZORT</button>
      <button class="t sheet-btn" data-act="paste" data-slot="sh-paste">📋 BEILLESZTÉS</button>
      <button class="t sheet-btn" data-act="restore" data-slot="sh-restore">↶ VISSZAÁLLÍTÁS</button>
      <button class="t sheet-btn secondary" data-act="sheet-close" data-slot="sh-close">✕ Mégse</button>
      <textarea id="paste-box" data-native hidden rows="2" spellcheck="false" placeholder="Tartsd itt hosszan az ujjad, és válaszd a „Beillesztés” lehetőséget"></textarea>
    </div>
  </div>

  <!-- Visszacsukás: a kurzor nem a szöveg végén áll -->
  <div id="sheet-end" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-q">A kurzor nem a szöveg végén van. Ugorjon a szöveg végére?</div>
      <div class="sheet-row">
        <button class="t sheet-btn" data-act="end-yes" data-slot="se-yes">IGEN</button>
        <button class="t sheet-btn secondary" data-act="end-no" data-slot="se-no">NEM</button>
      </div>
    </div>
  </div>

  <!-- Telepítés felajánlása (csak böngészőből indítva, ha a böngésző támogatja) -->
  <div id="overlay-install" class="overlay" hidden>
    <div class="ov-head">
      <button class="ov-btn" id="install-later" type="button" data-native>✕ Később</button>
      <div class="pin-title">Telepítés a készülékre</div>
    </div>
    <div class="install-body">
      <p>Telepítsd az alkalmazást: külön ikonról indul, teljes képernyőn fut, és internet nélkül is működik.</p>
      <button id="install-go" type="button" data-native>📲 TELEPÍTÉS</button>
      <p class="small">Ezt a lépést a segítő is elvégezheti.</p>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <div id="touch-marker"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
